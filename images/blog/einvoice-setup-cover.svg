<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59,130,246,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- eyebrow pill -->
  <rect x="80" y="86" width="150" height="38" rx="19" fill="rgba(59,130,246,0.12)" stroke="rgba(96,165,250,0.5)" stroke-width="1"/>
  <text x="155" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1.2">E-INVOICE</text>

  <!-- title -->
  <text x="80" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#F8FAFC">
    <tspan x="80" dy="0">Spreadsheet or</tspan>
    <tspan x="80" dy="62">System Connection?</tspan>
  </text>

  <!-- subtitle -->
  <text x="80" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94A3B8">
    <tspan x="80" dy="0">Choosing the right e-invoice setup</tspan>
  </text>

  <!-- divider -->
  <rect x="80" y="385" width="64" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- brand -->
  <text x="80" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">SteadyDevs</text>
  <text x="80" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748B">LHDN E-Invoicing</text>

  <!-- illustration: two paths into MyInvois -->
  <g transform="translate(760,150)" filter="url(#soft)">
    <rect x="0" y="0" width="150" height="80" rx="14" fill="#121821" stroke="rgba(96,165,250,0.4)" stroke-width="2"/>
    <text x="75" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="middle">Spreadsheet</text>
    <text x="75" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#93C5FD" text-anchor="middle">Excel / CSV</text>
    <rect x="200" y="0" width="150" height="80" rx="14" fill="#121821" stroke="rgba(96,165,250,0.4)" stroke-width="2"/>
    <text x="275" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#F1F5F9" text-anchor="middle">POS / ERP</text>
    <text x="275" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#93C5FD" text-anchor="middle">Export or API</text>
    <path d="M 75 80 L 75 130 L 175 170" fill="none" stroke="#60A5FA" stroke-width="3"/>
    <path d="M 275 80 L 275 130 L 175 170" fill="none" stroke="#60A5FA" stroke-width="3"/>
    <rect x="75" y="170" width="200" height="90" rx="16" fill="#0F2A4A" stroke="#3B82F6" stroke-width="2"/>
    <text x="175" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC" text-anchor="middle">MyInvois</text>
    <text x="175" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#86EFAC" text-anchor="middle">Validated</text>
  </g>
</svg>
