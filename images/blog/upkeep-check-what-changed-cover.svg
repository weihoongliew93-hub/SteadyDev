<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59,130,246,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- eyebrow pill -->
  <rect x="80" y="86" width="250" height="38" rx="19" fill="rgba(59,130,246,0.12)" stroke="rgba(96,165,250,0.5)" stroke-width="1"/>
  <text x="205" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1.2">UPKEEP CHECK 1.2</text>

  <!-- title -->
  <text x="80" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#F8FAFC">
    <tspan x="80" dy="0">What Changed</tspan>
    <tspan x="80" dy="62">Before It Broke?</tspan>
  </text>

  <!-- subtitle -->
  <text x="80" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94A3B8">
    <tspan x="80" dy="0">A free record of updates and the errors that followed</tspan>
  </text>

  <rect x="80" y="385" width="64" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="80" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">SteadyDevs</text>
  <text x="80" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748B">Upkeep Check for WordPress</text>

  <!-- illustration: a timeline card, one update then one error -->
  <g transform="translate(770,140)" filter="url(#soft)">
    <rect x="0" y="0" width="350" height="350" rx="20" fill="#121821" stroke="rgba(96,165,250,0.35)" stroke-width="2"/>
    <text x="24" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1">TUESDAY · WHAT CHANGED?</text>

    <!-- spine -->
    <line x1="52" y1="78" x2="52" y2="300" stroke="#1F2937" stroke-width="2"/>

    <!-- 09:12 plugin activated -->
    <circle cx="52" cy="92" r="7" fill="#1A2230" stroke="#64748B" stroke-width="2"/>
    <text x="72" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">09:12</text>
    <text x="72" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#CBD5E1">Cache plugin activated</text>

    <!-- 10:37 update -->
    <circle cx="52" cy="152" r="7" fill="url(#accent)"/>
    <text x="72" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">10:37</text>
    <text x="72" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#E2E8F0" font-weight="700">Page builder updated 3.20 → 3.21</text>
    <text x="72" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">by Aisyah</text>

    <!-- 10:41 fatal -->
    <circle cx="52" cy="226" r="7" fill="#1A2230" stroke="#F87171" stroke-width="2.5"/>
    <path d="M48 222 L56 230 M56 222 L48 230" stroke="#F87171" stroke-width="2" stroke-linecap="round"/>
    <text x="72" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">10:41</text>
    <text x="72" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#FCA5A5" font-weight="700">Fatal error in Page builder</text>
    <rect x="72" y="252" width="254" height="50" rx="8" fill="rgba(248,113,113,0.10)" stroke="rgba(248,113,113,0.35)" stroke-width="1"/>
    <text x="84" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#CBD5E1">In the 24 hours before this error:</text>
    <text x="84" y="291" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#F8FAFC" font-weight="700">Page builder updated · 4 minutes earlier</text>

    <text x="24" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#60A5FA" font-weight="700">Recorded on your site · nothing sent anywhere</text>
  </g>
</svg>
