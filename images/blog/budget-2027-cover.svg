<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59,130,246,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- eyebrow pill -->
  <rect x="80" y="86" width="170" height="38" rx="19" fill="rgba(59,130,246,0.12)" stroke="rgba(96,165,250,0.5)" stroke-width="1"/>
  <text x="165" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1.2">PLANNING</text>

  <!-- title -->
  <text x="80" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#F8FAFC">
    <tspan x="80" dy="0">Your 2027</tspan>
    <tspan x="80" dy="62">System Budget</tspan>
  </text>

  <!-- subtitle -->
  <text x="80" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94A3B8">
    <tspan x="80" dy="0">What to fix, keep and replace</tspan>
  </text>

  <!-- divider -->
  <rect x="80" y="385" width="64" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- brand -->
  <text x="80" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">SteadyDevs</text>
  <text x="80" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748B">Legacy System Assessments</text>

  <!-- illustration: one-page plan, three columns -->
  <g transform="translate(760,140)" filter="url(#soft)">
    <rect x="0" y="0" width="360" height="290" rx="18" fill="#121821" stroke="rgba(96,165,250,0.4)" stroke-width="2"/>
    <text x="22" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#93C5FD" letter-spacing="1">2027 PLAN</text>
    <text x="70" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FCA5A5" text-anchor="middle">Fix</text>
    <text x="180" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#86EFAC" text-anchor="middle">Keep</text>
    <text x="290" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FDE68A" text-anchor="middle">Replace</text>
    <line x1="125" y1="58" x2="125" y2="266" stroke="#334155" stroke-width="2"/>
    <line x1="235" y1="58" x2="235" y2="266" stroke="#334155" stroke-width="2"/>
    <rect x="22" y="94" width="96" height="30" rx="7" fill="rgba(248,113,113,0.25)" stroke="#F87171"/>
    <rect x="22" y="134" width="96" height="30" rx="7" fill="rgba(248,113,113,0.25)" stroke="#F87171"/>
    <rect x="22" y="174" width="96" height="30" rx="7" fill="rgba(248,113,113,0.25)" stroke="#F87171"/>
    <rect x="132" y="94" width="96" height="30" rx="7" fill="rgba(134,239,172,0.2)" stroke="#86EFAC"/>
    <rect x="132" y="134" width="96" height="30" rx="7" fill="rgba(134,239,172,0.2)" stroke="#86EFAC"/>
    <rect x="132" y="174" width="96" height="30" rx="7" fill="rgba(134,239,172,0.2)" stroke="#86EFAC"/>
    <rect x="132" y="214" width="96" height="30" rx="7" fill="rgba(134,239,172,0.2)" stroke="#86EFAC"/>
    <rect x="242" y="94" width="96" height="30" rx="7" fill="rgba(250,204,21,0.2)" stroke="#FACC15"/>
  </g>
</svg>
