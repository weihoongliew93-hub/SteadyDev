<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59,130,246,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- eyebrow pill -->
  <rect x="80" y="86" width="260" height="38" rx="19" fill="rgba(59,130,246,0.12)" stroke="rgba(96,165,250,0.5)" stroke-width="1"/>
  <text x="210" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1.2">E-INVOICE &#183; LHDN</text>

  <!-- title -->
  <text x="80" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#F8FAFC">
    <tspan x="80" dy="0">Self-Billed E-Invoices</tspan>
    <tspan x="80" dy="62">Most SMEs Miss</tspan>
  </text>

  <!-- subtitle -->
  <text x="80" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94A3B8">
    <tspan x="80" dy="0">When you have to issue an e-invoice to yourself</tspan>
  </text>

  <!-- divider -->
  <rect x="80" y="385" width="64" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- brand -->
  <text x="80" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">SteadyDevs</text>
  <text x="80" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748B">E-Invoice Readiness for Legacy Systems</text>

  <!-- illustration: the supplier who cannot issue one -->
  <g transform="translate(800,128)" filter="url(#soft)">
    <rect x="0" y="0" width="250" height="104" rx="14" fill="#161D29" stroke="rgba(251,191,36,0.6)" stroke-width="2"/>
    <text x="18" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#FBBF24" letter-spacing="1">FOREIGN SUPPLIER</text>
    <text x="18" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#F1F5F9">No Malaysian TIN</text>
    <text x="18" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94A3B8">Cannot issue an e-invoice</text>
  </g>

  <!-- flow arrow -->
  <g transform="translate(880,250)">
    <path d="M30 0 L30 52" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
    <path d="M12 36 L30 54 L48 36" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="66" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#93C5FD">so you issue it</text>
  </g>

  <!-- illustration: the self-billed document -->
  <g transform="translate(800,330)" filter="url(#soft)">
    <rect x="0" y="0" width="250" height="128" rx="16" fill="#121821" stroke="rgba(96,165,250,0.5)" stroke-width="2"/>
    <rect x="0" y="0" width="250" height="34" rx="16" fill="url(#accent)"/>
    <text x="16" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0F14">SELF-BILLED E-INVOICE</text>
    <text x="16" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94A3B8">Buyer</text>
    <text x="86" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">Your business</text>
    <text x="16" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94A3B8">Issued by</text>
    <text x="86" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0">Your business</text>
    <rect x="16" y="102" width="132" height="15" rx="7.5" fill="rgba(34,197,94,0.15)"/>
    <text x="24" y="113" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#4ADE80" letter-spacing="0.6">MYINVOIS VALIDATED</text>
    <circle cx="212" cy="86" r="18" fill="rgba(34,197,94,0.15)"/>
    <path d="M204 86 L210 92 L221 78" stroke="#4ADE80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
