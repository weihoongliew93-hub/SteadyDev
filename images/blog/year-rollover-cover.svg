<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59,130,246,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- eyebrow pill -->
  <rect x="80" y="86" width="170" height="38" rx="19" fill="rgba(59,130,246,0.12)" stroke="rgba(96,165,250,0.5)" stroke-width="1"/>
  <text x="165" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1.2">YEAR-END</text>

  <!-- title -->
  <text x="80" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#F8FAFC">
    <tspan x="80" dy="0">The New Year</tspan>
    <tspan x="80" dy="62">Bug Check</tspan>
  </text>

  <!-- subtitle -->
  <text x="80" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94A3B8">
    <tspan x="80" dy="0">What breaks in older systems on 1 January</tspan>
  </text>

  <!-- divider -->
  <rect x="80" y="385" width="64" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- brand -->
  <text x="80" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">SteadyDevs</text>
  <text x="80" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748B">Legacy System Assessments</text>

  <!-- illustration: two calendar pages -->
  <g transform="translate(760,160)" filter="url(#soft)">
    <rect x="0" y="20" width="160" height="190" rx="16" fill="#121821" stroke="rgba(96,165,250,0.4)" stroke-width="2"/>
    <rect x="0" y="20" width="160" height="44" rx="16" fill="#1E293B"/>
    <text x="80" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#93C5FD" text-anchor="middle">DEC 2026</text>
    <text x="80" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#94A3B8" text-anchor="middle">31</text>
    <path d="M 172 115 L 196 115" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
    <path d="M 188 105 L 198 115 L 188 125" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="210" y="0" width="160" height="210" rx="16" fill="#121821" stroke="#3B82F6" stroke-width="2"/>
    <rect x="210" y="0" width="160" height="44" rx="16" fill="#0F2A4A"/>
    <text x="290" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle">JAN 2027</text>
    <text x="290" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#F8FAFC" text-anchor="middle">1</text>
    <circle cx="352" cy="190" r="22" fill="#FACC15"/>
    <text x="352" y="199" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#0B0F14" text-anchor="middle">!</text>
    <text x="185" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Numbering · Week 53 · Certificates</text>
  </g>
</svg>
