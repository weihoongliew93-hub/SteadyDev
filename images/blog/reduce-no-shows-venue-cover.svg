<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59,130,246,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- eyebrow pill -->
  <rect x="80" y="86" width="230" height="38" rx="19" fill="rgba(59,130,246,0.12)" stroke="rgba(96,165,250,0.5)" stroke-width="1"/>
  <text x="195" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1.2">VENUE BOOKING</text>

  <!-- title -->
  <text x="80" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#F8FAFC">
    <tspan x="80" dy="0">No-Shows Are Quietly</tspan>
    <tspan x="80" dy="62">Eating Your Margin</tspan>
  </text>

  <!-- subtitle -->
  <text x="80" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94A3B8">
    <tspan x="80" dy="0">Deposits, reminders and policies that actually work</tspan>
  </text>

  <!-- divider -->
  <rect x="80" y="385" width="64" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- brand -->
  <text x="80" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">SteadyDevs</text>
  <text x="80" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748B">Venue Booking for WordPress</text>

  <!-- illustration: the empty slot -->
  <g transform="translate(800,140)" filter="url(#soft)">
    <rect x="0" y="0" width="230" height="106" rx="14" fill="#161D29" stroke="rgba(248,113,113,0.75)" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="18" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#F87171" letter-spacing="1">NO SHOW</text>
    <text x="18" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#F1F5F9">8:00 PM &#8211; Saturday</text>
    <text x="18" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94A3B8">Booked. Blocked. Empty.</text>
    <circle cx="204" cy="26" r="16" fill="#7F1D1D"/>
    <path d="M197 19 L211 33 M211 19 L197 33" stroke="#FCA5A5" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- arrow -->
  <g transform="translate(1010,268)">
    <path d="M0 30 L60 30" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
    <path d="M44 12 L62 30 L44 48" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- illustration: the kept booking -->
  <g transform="translate(940,330)" filter="url(#soft)">
    <rect x="0" y="0" width="200" height="112" rx="16" fill="#121821" stroke="rgba(96,165,250,0.5)" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="34" rx="16" fill="url(#accent)"/>
    <text x="16" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B0F14">DEPOSIT PAID</text>
    <text x="16" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0">8:00 PM &#8211; Saturday</text>
    <text x="16" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94A3B8">Reminded. Showed up.</text>
    <circle cx="175" cy="57" r="16" fill="rgba(34,197,94,0.15)"/>
    <path d="M168 57 L173 62 L183 50" stroke="#4ADE80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
