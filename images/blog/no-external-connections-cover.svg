<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59,130,246,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <rect x="80" y="86" width="230" height="38" rx="19" fill="rgba(59,130,246,0.12)" stroke="rgba(96,165,250,0.5)" stroke-width="1"/>
  <text x="195" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1.2">VENUE BOOKING</text>

  <text x="80" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#F8FAFC">
    <tspan x="80" dy="0">Nothing Leaves</tspan>
    <tspan x="80" dy="62">Your Server</tspan>
  </text>

  <text x="80" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94A3B8">
    <tspan x="80" dy="0">No third parties, no account, no phoning home</tspan>
  </text>

  <rect x="80" y="385" width="64" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="80" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">SteadyDevs</text>
  <text x="80" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748B">Venue Booking for WordPress</text>

  <!-- illustration: your site, sealed; outbound arrows struck out -->
  <g transform="translate(820,150)" filter="url(#soft)">
    <rect x="0" y="0" width="300" height="330" rx="20" fill="#121821" stroke="rgba(96,165,250,0.5)" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="44" rx="20" fill="#1A2230"/>
    <rect x="0" y="24" width="300" height="20" fill="#1A2230"/>
    <circle cx="22" cy="22" r="5" fill="#F87171"/>
    <circle cx="40" cy="22" r="5" fill="#FBBF24"/>
    <circle cx="58" cy="22" r="5" fill="#4ADE80"/>
    <text x="150" y="27" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">YOUR WORDPRESS SITE</text>

    <!-- padlock -->
    <path d="M150 112 a32 32 0 0 1 32 32 v18 h-14 v-18 a18 18 0 0 0 -36 0 v18 h-14 v-18 a32 32 0 0 1 32 -32 z" fill="#60A5FA"/>
    <rect x="100" y="160" width="100" height="78" rx="14" fill="url(#accent)"/>
    <circle cx="150" cy="192" r="9" fill="#0B0F14"/>
    <rect x="146" y="196" width="8" height="18" rx="3" fill="#0B0F14"/>

    <text x="150" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0" text-anchor="middle">Bookings · Emails · Reports</text>
    <text x="150" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">all in your own database</text>
  </g>

  <!-- blocked outbound arrows -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M760 220 L700 220" stroke="#475569" stroke-width="4"/>
    <path d="M716 206 L700 220 L716 234" stroke="#475569" stroke-width="4"/>
    <circle cx="670" cy="220" r="16" fill="#1A2230" stroke="rgba(248,113,113,0.9)" stroke-width="2"/>
    <path d="M663 213 L677 227 M677 213 L663 227" stroke="#F87171" stroke-width="3"/>

    <path d="M760 315 L700 315" stroke="#475569" stroke-width="4"/>
    <path d="M716 301 L700 315 L716 329" stroke="#475569" stroke-width="4"/>
    <circle cx="670" cy="315" r="16" fill="#1A2230" stroke="rgba(248,113,113,0.9)" stroke-width="2"/>
    <path d="M663 308 L677 322 M677 308 L663 322" stroke="#F87171" stroke-width="3"/>

    <path d="M760 410 L700 410" stroke="#475569" stroke-width="4"/>
    <path d="M716 396 L700 410 L716 424" stroke="#475569" stroke-width="4"/>
    <circle cx="670" cy="410" r="16" fill="#1A2230" stroke="rgba(248,113,113,0.9)" stroke-width="2"/>
    <path d="M663 403 L677 417 M677 403 L663 417" stroke="#F87171" stroke-width="3"/>
  </g>
  <text x="640" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="end">third-party services</text>
  <text x="640" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="end">analytics</text>
  <text x="640" y="415" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="end">phoning home</text>
</svg>
