<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59,130,246,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- eyebrow pill -->
  <rect x="80" y="86" width="158" height="38" rx="19" fill="rgba(59,130,246,0.12)" stroke="rgba(96,165,250,0.5)" stroke-width="1"/>
  <text x="159" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1.2">CLOUD COSTS</text>

  <!-- title -->
  <text x="80" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#F8FAFC">
    <tspan x="80" dy="0">Your Cloud Bill</tspan>
    <tspan x="80" dy="62">Keeps Climbing</tspan>
  </text>

  <!-- subtitle -->
  <text x="80" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94A3B8">
    <tspan x="80" dy="0">Six places inherited setups leak money</tspan>
  </text>

  <!-- divider -->
  <rect x="80" y="385" width="64" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- brand -->
  <text x="80" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">SteadyDevs</text>
  <text x="80" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748B">Cloud Cost Optimisation</text>

  <!-- illustration -->
  <g transform="translate(780,150)" filter="url(#soft)">
    <rect x="0" y="0" width="320" height="300" rx="18" fill="#121821" stroke="rgba(96,165,250,0.4)" stroke-width="2"/>
    <text x="22" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#93C5FD" letter-spacing="1">MONTHLY CLOUD BILL</text>
    <rect x="34" y="170" width="32" height="90" rx="5" fill="url(#accent)"/>
    <rect x="34" y="170" width="32" height="27" rx="5" fill="rgba(248,113,113,0.75)"/>
    <rect x="80" y="150" width="32" height="110" rx="5" fill="url(#accent)"/>
    <rect x="80" y="150" width="32" height="33" rx="5" fill="rgba(248,113,113,0.75)"/>
    <rect x="126" y="132" width="32" height="128" rx="5" fill="url(#accent)"/>
    <rect x="126" y="132" width="32" height="38" rx="5" fill="rgba(248,113,113,0.75)"/>
    <rect x="172" y="110" width="32" height="150" rx="5" fill="url(#accent)"/>
    <rect x="172" y="110" width="32" height="45" rx="5" fill="rgba(248,113,113,0.75)"/>
    <rect x="218" y="88" width="32" height="172" rx="5" fill="url(#accent)"/>
    <rect x="218" y="88" width="32" height="52" rx="5" fill="rgba(248,113,113,0.75)"/>
    <rect x="264" y="60" width="32" height="200" rx="5" fill="url(#accent)"/>
    <rect x="264" y="60" width="32" height="60" rx="5" fill="rgba(248,113,113,0.75)"/>
    <line x1="22" y1="262" x2="298" y2="262" stroke="#334155" stroke-width="2"/>
    <rect x="22" y="276" width="12" height="12" rx="3" fill="rgba(248,113,113,0.75)"/>
    <text x="40" y="287" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#FCA5A5">idle disks, IPs, snapshots, logs</text>
  </g>
</svg>
