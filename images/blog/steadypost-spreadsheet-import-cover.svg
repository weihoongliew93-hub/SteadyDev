<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59,130,246,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- eyebrow pill -->
  <rect x="80" y="86" width="190" height="38" rx="19" fill="rgba(59,130,246,0.12)" stroke="rgba(96,165,250,0.5)" stroke-width="1"/>
  <text x="175" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1.2">STEADYPOST</text>

  <!-- title -->
  <text x="80" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#F8FAFC">
    <tspan x="80" dy="0">From Spreadsheet</tspan>
    <tspan x="80" dy="62">to Published Posts</tspan>
  </text>

  <!-- subtitle -->
  <text x="80" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94A3B8">
    <tspan x="80" dy="0">Dry run first. No duplicates. One-click undo.</tspan>
  </text>

  <rect x="80" y="385" width="64" height="5" rx="2.5" fill="url(#accent)"/>

  <text x="80" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">SteadyDevs</text>
  <text x="80" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748B">SteadyPost for WordPress</text>

  <!-- illustration: a sheet on the left becoming post cards on the right -->
  <g transform="translate(730,150)" filter="url(#soft)">
    <!-- spreadsheet -->
    <rect x="0" y="0" width="190" height="330" rx="16" fill="#121821" stroke="rgba(96,165,250,0.35)" stroke-width="2"/>
    <text x="18" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">PAGES.XLSX</text>
    <!-- header row -->
    <rect x="18" y="46" width="154" height="22" rx="4" fill="rgba(96,165,250,0.18)"/>
    <text x="26" y="61" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#93C5FD">Title · Area · Price · Status</text>
    <!-- rows -->
    <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#CBD5E1">
      <rect x="18" y="78" width="154" height="24" rx="4" fill="#1A2230"/><text x="26" y="94">Plumber in Shah Alam</text>
      <rect x="18" y="108" width="154" height="24" rx="4" fill="#1A2230"/><text x="26" y="124">Plumber in Klang</text>
      <rect x="18" y="138" width="154" height="24" rx="4" fill="#1A2230"/><text x="26" y="154">Plumber in Subang</text>
      <rect x="18" y="168" width="154" height="24" rx="4" fill="#1A2230"/><text x="26" y="184">Plumber in Puchong</text>
      <rect x="18" y="198" width="154" height="24" rx="4" fill="#1A2230"/><text x="26" y="214">Plumber in Cheras</text>
      <rect x="18" y="228" width="154" height="24" rx="4" fill="#1A2230"/><text x="26" y="244">Plumber in Ampang</text>
      <rect x="18" y="258" width="154" height="24" rx="4" fill="#1A2230"/><text x="26" y="274">Plumber in Kajang</text>
    </g>
    <text x="18" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748B">… 793 more rows</text>

    <!-- arrow -->
    <path d="M206 165 L250 165" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M242 153 L256 165 L242 177" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- post cards -->
    <g transform="translate(270,30)">
      <rect x="20" y="0" width="150" height="86" rx="12" fill="#1A2230" stroke="rgba(96,165,250,0.25)" stroke-width="1"/>
      <rect x="10" y="20" width="150" height="86" rx="12" fill="#1A2230" stroke="rgba(96,165,250,0.3)" stroke-width="1"/>
      <rect x="0" y="40" width="150" height="86" rx="12" fill="#121821" stroke="rgba(96,165,250,0.6)" stroke-width="2"/>
      <rect x="14" y="54" width="60" height="7" rx="3.5" fill="url(#accent)"/>
      <rect x="14" y="70" width="118" height="6" rx="3" fill="#334155"/>
      <rect x="14" y="82" width="100" height="6" rx="3" fill="#334155"/>
      <rect x="14" y="94" width="110" height="6" rx="3" fill="#334155"/>
      <rect x="14" y="108" width="54" height="12" rx="6" fill="rgba(34,197,94,0.18)"/>
      <text x="41" y="117" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#4ADE80" text-anchor="middle">PUBLISHED</text>
    </g>

    <!-- dry run and undo pills -->
    <rect x="270" y="196" width="150" height="34" rx="17" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.45)" stroke-width="1"/>
    <text x="345" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">Dry run: 800 to create</text>
    <rect x="270" y="240" width="150" height="34" rx="17" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.45)" stroke-width="1"/>
    <text x="345" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">Re-import: 0 duplicates</text>
    <rect x="270" y="284" width="150" height="34" rx="17" fill="rgba(96,165,250,0.12)" stroke="rgba(96,165,250,0.45)" stroke-width="1"/>
    <text x="345" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">Undo the whole run</text>
  </g>
</svg>
