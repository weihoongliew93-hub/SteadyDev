<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59,130,246,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- eyebrow pill -->
  <rect x="80" y="86" width="230" height="38" rx="19" fill="rgba(59,130,246,0.12)" stroke="rgba(96,165,250,0.5)" stroke-width="1"/>
  <text x="195" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1.2">VENUE BOOKING</text>

  <!-- title -->
  <text x="80" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" fill="#F8FAFC">
    <tspan x="80" dy="0">Stop Taking Bookings</tspan>
    <tspan x="80" dy="64">Over WhatsApp</tspan>
  </text>

  <!-- subtitle -->
  <text x="80" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94A3B8">
    <tspan x="80" dy="0">Why your venue needs online booking in 2026</tspan>
  </text>

  <!-- divider -->
  <rect x="80" y="385" width="64" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- brand -->
  <text x="80" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">SteadyDevs</text>
  <text x="80" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748B">Venue Booking for WordPress</text>

  <!-- illustration: phone chat bubble -->
  <g transform="translate(760,150)" filter="url(#soft)">
    <rect x="0" y="0" width="230" height="300" rx="28" fill="#121821" stroke="rgba(96,165,250,0.35)" stroke-width="2"/>
    <rect x="18" y="30" width="140" height="34" rx="17" fill="#1E293B"/>
    <rect x="18" y="76" width="180" height="34" rx="17" fill="#1E293B"/>
    <rect x="18" y="122" width="110" height="34" rx="17" fill="#1E293B"/>
    <circle cx="115" cy="230" r="46" fill="rgba(239,68,68,0.14)"/>
    <path d="M95 230 L135 230 M115 210 L115 250" stroke="#F87171" stroke-width="8" stroke-linecap="round" transform="rotate(45 115 230)"/>
    <text x="115" y="285" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748B" text-anchor="middle">No reply after hours</text>
  </g>

  <!-- arrow -->
  <g transform="translate(1010,270)">
    <path d="M0 30 L60 30" stroke="#60A5FA" stroke-width="4" stroke-linecap="round"/>
    <path d="M44 12 L62 30 L44 48" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- illustration: calendar with check -->
  <g transform="translate(950,330)" filter="url(#soft)">
    <rect x="0" y="0" width="170" height="150" rx="18" fill="#121821" stroke="rgba(96,165,250,0.5)" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="34" rx="18" fill="url(#accent)"/>
    <rect x="16" y="52" width="30" height="30" rx="6" fill="#1E293B"/>
    <rect x="54" y="52" width="30" height="30" rx="6" fill="#1E293B"/>
    <rect x="92" y="52" width="30" height="30" rx="6" fill="rgba(59,130,246,0.9)"/>
    <rect x="130" y="52" width="24" height="30" rx="6" fill="#1E293B"/>
    <rect x="16" y="90" width="30" height="30" rx="6" fill="#1E293B"/>
    <rect x="54" y="90" width="30" height="30" rx="6" fill="#1E293B"/>
    <rect x="92" y="90" width="30" height="30" rx="6" fill="#1E293B"/>
    <rect x="130" y="90" width="24" height="30" rx="6" fill="#1E293B"/>
    <circle cx="107" cy="67" r="16" fill="none"/>
    <path d="M100 67 L105 72 L115 60" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
