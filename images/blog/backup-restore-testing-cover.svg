<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59,130,246,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- eyebrow pill -->
  <rect x="80" y="86" width="210" height="38" rx="19" fill="rgba(59,130,246,0.12)" stroke="rgba(96,165,250,0.5)" stroke-width="1"/>
  <text x="185" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1.2">BUSINESS RISK</text>

  <!-- title -->
  <text x="80" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800" fill="#F8FAFC">
    <tspan x="80" dy="0">Your Backup Isn&#8217;t a Backup</tspan>
    <tspan x="80" dy="60">Until You&#8217;ve Restored It</tspan>
  </text>

  <!-- subtitle -->
  <text x="80" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94A3B8">
    <tspan x="80" dy="0">Find out now, not during the outage</tspan>
  </text>

  <!-- divider -->
  <rect x="80" y="385" width="64" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- brand -->
  <text x="80" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">SteadyDevs</text>
  <text x="80" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748B">Legacy .NET &amp; SQL Server Care</text>

  <!-- illustration: backups all reporting success -->
  <g transform="translate(820,130)" filter="url(#soft)">
    <rect x="0" y="0" width="250" height="132" rx="14" fill="#121821" stroke="rgba(96,165,250,0.35)" stroke-width="2"/>
    <text x="18" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#93C5FD" letter-spacing="1">NIGHTLY BACKUP</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94A3B8">
      <text x="18" y="62">Mon</text>
      <text x="18" y="88">Tue</text>
      <text x="18" y="114">Wed</text>
    </g>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#4ADE80">
      <text x="74" y="62">Success</text>
      <text x="74" y="88">Success</text>
      <text x="74" y="114">Success</text>
    </g>
    <g stroke="#4ADE80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M206 56 L212 62 L223 50"/>
      <path d="M206 82 L212 88 L223 76"/>
      <path d="M206 108 L212 114 L223 102"/>
    </g>
  </g>

  <!-- illustration: the question nobody asks -->
  <g transform="translate(820,306)" filter="url(#soft)">
    <rect x="0" y="0" width="250" height="122" rx="16" fill="#1A1410" stroke="rgba(251,191,36,0.75)" stroke-width="2"/>
    <text x="18" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#FBBF24" letter-spacing="1">LAST RESTORE TEST</text>
    <text x="18" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="800" fill="#F8FAFC">Never</text>
    <text x="18" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94A3B8">Untested is unproven</text>
    <circle cx="210" cy="64" r="20" fill="rgba(251,191,36,0.14)"/>
    <path d="M210 54 L210 66" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="210" cy="74" r="2" fill="#FBBF24"/>
  </g>
</svg>
