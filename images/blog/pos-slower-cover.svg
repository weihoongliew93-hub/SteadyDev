<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59,130,246,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- eyebrow pill -->
  <rect x="80" y="86" width="170" height="38" rx="19" fill="rgba(59,130,246,0.12)" stroke="rgba(96,165,250,0.5)" stroke-width="1"/>
  <text x="165" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1.2">POS SYSTEMS</text>

  <!-- title -->
  <text x="80" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#F8FAFC">
    <tspan x="80" dy="0">Slower Every</tspan>
    <tspan x="80" dy="62">Month?</tspan>
  </text>

  <!-- subtitle -->
  <text x="80" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94A3B8">
    <tspan x="80" dy="0">It's usually the database, not the age</tspan>
  </text>

  <!-- divider -->
  <rect x="80" y="385" width="64" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- brand -->
  <text x="80" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">SteadyDevs</text>
  <text x="80" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748B">Legacy System Assessments</text>

  <!-- illustration: checkout time rising -->
  <g transform="translate(780,150)" filter="url(#soft)">
    <rect x="0" y="0" width="320" height="270" rx="18" fill="#121821" stroke="rgba(96,165,250,0.4)" stroke-width="2"/>
    <text x="22" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#93C5FD" letter-spacing="1">CHECKOUT TIME</text>
    <line x1="30" y1="230" x2="296" y2="230" stroke="#334155" stroke-width="2"/>
    <rect x="40" y="200" width="28" height="30" rx="4" fill="#60A5FA"/>
    <rect x="82" y="190" width="28" height="40" rx="4" fill="#60A5FA"/>
    <rect x="124" y="172" width="28" height="58" rx="4" fill="#60A5FA"/>
    <rect x="166" y="148" width="28" height="82" rx="4" fill="#FACC15"/>
    <rect x="208" y="116" width="28" height="114" rx="4" fill="#FB923C"/>
    <rect x="250" y="72" width="28" height="158" rx="4" fill="#F87171"/>
    <text x="264" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#FCA5A5" text-anchor="middle">8s</text>
    <text x="54" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Y1</text>
    <text x="264" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Y4</text>
  </g>
</svg>
