<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59,130,246,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- eyebrow pill -->
  <rect x="80" y="86" width="189" height="38" rx="19" fill="rgba(59,130,246,0.12)" stroke="rgba(96,165,250,0.5)" stroke-width="1"/>
  <text x="174.5" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1.2">END OF SUPPORT</text>

  <!-- title -->
  <text x="80" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#F8FAFC">
    <tspan x="80" dy="0">Still Running</tspan>
    <tspan x="80" dy="62">on 2016?</tspan>
  </text>

  <!-- subtitle -->
  <text x="80" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94A3B8">
    <tspan x="80" dy="0">SQL Server and Windows Server deadlines</tspan>
  </text>

  <!-- divider -->
  <rect x="80" y="385" width="64" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- brand -->
  <text x="80" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">SteadyDevs</text>
  <text x="80" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748B">Legacy System Assessments</text>

  <!-- illustration -->
  <g transform="translate(780,170)" filter="url(#soft)">
    <rect x="0" y="0" width="320" height="250" rx="18" fill="#121821" stroke="rgba(96,165,250,0.4)" stroke-width="2"/>
    <text x="22" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#93C5FD" letter-spacing="1">EXTENDED SUPPORT</text>
    <line x1="44" y1="70" x2="44" y2="214" stroke="#334155" stroke-width="3"/>
    <circle cx="44" cy="90" r="11" fill="#F87171"/>
    <text x="70" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F1F5F9">SQL Server 2016</text>
    <text x="70" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#FCA5A5">Ended 14 July 2026</text>
    <circle cx="44" cy="190" r="11" fill="#FACC15"/>
    <text x="70" y="186" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#F1F5F9">Windows Server 2016</text>
    <text x="70" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#FDE68A">Ends January 2027</text>
  </g>
</svg>
