<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59,130,246,0.10)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="82%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0B0F14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <rect x="80" y="86" width="156" height="38" rx="19" fill="rgba(59,130,246,0.12)" stroke="rgba(96,165,250,0.5)" stroke-width="1"/>
  <text x="158.0" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="1.2">LHDN UPDATE</text>
  <text x="80" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="800" fill="#F8FAFC">
    <tspan x="80" dy="0">The E-Invoice</tspan>
    <tspan x="80" dy="62">Rules Changed Again</tspan>
  </text>
  <text x="80" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#94A3B8">
    <tspan x="80" dy="0">RM3 million exemption, and a</tspan>
    <tspan x="80" dy="32">31 December 2027 relaxation</tspan>
  </text>
  <rect x="80" y="417" width="64" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="80" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#E2E8F0">SteadyDevs</text>
  <text x="80" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#64748B">E-Invoice Compliance</text>
  <g transform="translate(790,194)" filter="url(#soft)">
    <rect x="0" y="0" width="300" height="242" rx="18" fill="#121821" stroke="rgba(96,165,250,0.4)" stroke-width="2"/>
    <rect x="0" y="0" width="300" height="42" rx="18" fill="url(#accent)"/>
    <text x="20" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B0F14">OCTOBER 2026</text>
    <circle cx="36" cy="86" r="16" fill="rgba(34,197,94,0.15)"/>
    <path d="M29 86 L34 91 L44 79" stroke="#4ADE80" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="64" y="83" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#E2E8F0">Under RM3m</text>
    <text x="64" y="103" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748B">Exempt, with conditions</text>
    <circle cx="36" cy="146" r="16" fill="rgba(34,197,94,0.15)"/>
    <path d="M29 146 L34 151 L44 139" stroke="#4ADE80" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="64" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#E2E8F0">Phase 4 relaxation</text>
    <text x="64" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748B">Until 31 Dec 2027</text>
    <circle cx="36" cy="206" r="16" fill="rgba(248,113,113,0.15)"/>
    <path d="M29 199 L43 213 M43 199 L29 213" stroke="#F87171" stroke-width="3.2" stroke-linecap="round"/>
    <text x="64" y="203" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#E2E8F0">RM500k-1m phase</text>
    <text x="64" y="223" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#FCA5A5">No longer happening</text>
  </g>
